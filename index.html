<html lang="ko">

<style>
:root{
  /* 오방색 기반 — 쪽빛 · 청자 · 단청 주홍 · 황 · 한지 */
  --indigo:#15306E; --indigo2:#1E4496; --indigo-d:#0C1E48;
  --jade:#0E7C6B; --jade2:#15A48D; --jade-soft:#E2F4F0;
  --vermil:#D23C2C; --vermil-soft:#FCEBE8;
  --gold:#EDA91B; --gold2:#FFC94D; --gold-soft:#FFF2D4;
  --hanji:#FAF4E6; --paper:#FFFDF8; --ink:#1A1D2B; --muted:#7A7566;
  --line:#E4DAC4;
  --shadow:0 4px 0 rgba(21,48,110,.09), 0 14px 34px rgba(21,48,110,.11);
  --kr:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;
  --en:'Lexend','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--kr); color:var(--ink); background:var(--hanji);
  -webkit-font-smoothing:antialiased; overflow-x:hidden}
/* 한지 섬유 질감 */
body:before{content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
  background-image:
    repeating-linear-gradient(97deg, rgba(160,140,95,.055) 0 1px, transparent 1px 9px),
    repeating-linear-gradient(6deg, rgba(160,140,95,.045) 0 1px, transparent 1px 13px);}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
img{display:block}
.en-t{font-family:var(--en)}

/* ───── 상단바 ───── */
.topbar{position:sticky; top:0; z-index:60; background:linear-gradient(180deg,var(--indigo2),var(--indigo));
  color:#fff; display:flex; align-items:center; gap:20px; padding:11px 26px; min-height:80px;
  box-shadow:0 12px 26px rgba(12,30,72,.24)}
.topbar:after{content:""; position:absolute; left:0; right:0; bottom:0; height:5px;
  background:repeating-linear-gradient(90deg,
    var(--vermil) 0 34px, var(--gold) 34px 68px, var(--jade2) 68px 102px,
    #F4EFE2 102px 118px, var(--indigo-d) 118px 152px)}
.tb-badge{background:var(--gold); color:var(--indigo-d); font-weight:900; padding:7px 16px;
  border-radius:999px; font-size:20px; white-space:nowrap; letter-spacing:-.01em}
.tb-title{font-weight:900; font-size:25px; letter-spacing:-.02em; white-space:nowrap; line-height:1.2}
.tb-sub{font-weight:500; font-size:16px; color:#C9D8F5; white-space:nowrap}
.tb-steps{display:flex; gap:7px; margin-left:auto; flex-wrap:wrap; justify-content:flex-end; max-width:56%}
.tb-step{font-family:var(--en); font-size:14.5px; font-weight:700; padding:7px 14px; border-radius:999px;
  background:rgba(255,255,255,.13); color:#DCE7FA; border:2px solid transparent; transition:.15s; letter-spacing:.02em}
.tb-step:hover{background:rgba(255,255,255,.26)}
.tb-step.on{background:var(--gold); color:var(--indigo-d); border-color:#fff}
.tb-step.gp{background:rgba(21,164,141,.28); color:#CFF3EA}
.tb-step.gp.on{background:var(--jade2); color:#fff; border-color:#fff}
.tb-logo{height:48px; margin-left:12px; background:#fff; border-radius:11px; padding:5px 11px; flex:none}

.stage{position:relative; z-index:1; max-width:1720px; margin:0 auto; padding:26px 30px 124px;
  min-height:calc(100vh - 100px)}
#ink{position:absolute; inset:0; z-index:40; pointer-events:none; touch-action:none}
body.pen #ink{pointer-events:auto; cursor:crosshair}

.card{background:var(--paper); border-radius:24px; border:3px solid var(--line);
  box-shadow:var(--shadow); padding:30px 34px 28px; position:relative}
.chip{display:inline-flex; align-items:center; gap:9px; background:var(--indigo); color:#fff;
  font-weight:800; padding:8px 18px; border-radius:999px; font-size:16px;
  font-family:var(--en); letter-spacing:.09em}
.chip.j{background:var(--jade)}
h2.sec{font-size:34px; font-weight:900; margin:13px 0 6px; letter-spacing:-.025em; line-height:1.25}
.sec-note{color:var(--muted); font-weight:500; font-size:17px; margin:0 0 20px}
.sec-note.en-t{font-weight:400}
.mascot{position:absolute; pointer-events:none; user-select:none}
.rowbtns{display:flex; gap:11px; flex-wrap:wrap; margin-bottom:18px; align-items:center}
.mini{background:var(--gold-soft); border:2.5px solid var(--gold); color:#7A5405; font-weight:800;
  font-size:16px; padding:10px 20px; border-radius:12px; font-family:var(--en); letter-spacing:.05em}
.mini:hover{background:var(--gold2); color:var(--indigo-d)}
.mini.j{background:var(--jade-soft); border-color:var(--jade2); color:var(--jade)}
.mini.j:hover{background:var(--jade2); color:#fff}

/* ───── 홈 ───── */
.hero{position:relative; border-radius:26px; overflow:hidden; border:4px solid var(--gold);
  box-shadow:var(--shadow); min-height:330px; display:flex; align-items:center}
.hero .bgimg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.hero .veil{position:absolute; inset:0;
  background:linear-gradient(100deg, rgba(12,30,72,.93) 0%, rgba(21,48,110,.86) 38%,
    rgba(14,124,107,.55) 66%, rgba(14,124,107,.12) 100%)}
.hero .in{position:relative; padding:34px 42px; color:#fff; max-width:940px}
.hero .eyebrow{font-family:var(--en); font-weight:800; color:var(--gold2); letter-spacing:.26em; font-size:14px}
.hero h1{font-size:52px; font-weight:900; margin:8px 0 6px; letter-spacing:-.035em; line-height:1.08}
.hero h1 em{font-style:normal; color:var(--gold2)}
.hero .ko{font-size:22px; font-weight:700; color:#E7F5F1; margin:0 0 10px; letter-spacing:-.01em}
.hero p{font-size:17.5px; color:#D6E2F7; margin:0; font-weight:500; line-height:1.62; max-width:700px}
.hero .marks{display:flex; gap:9px; margin-top:17px; flex-wrap:wrap}
.hero .mk{background:rgba(255,255,255,.16); border:2px solid rgba(255,214,120,.55);
  padding:7px 16px; border-radius:999px; font-weight:700; font-size:15.5px}

.navgrid{display:grid; grid-template-columns:1.35fr 1fr; gap:20px; margin-top:22px}
.block{background:var(--paper); border:3px solid var(--line); border-radius:22px; padding:22px 24px; box-shadow:var(--shadow)}
.block h3{margin:0 0 3px; font-size:23px; font-weight:900; color:var(--indigo); font-family:var(--en); letter-spacing:.01em}
.block .bs{color:var(--muted); font-size:15px; font-weight:500; margin:0 0 15px}
.block.j h3{color:var(--jade)}
.plist{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.plist.one{grid-template-columns:1fr}
.pbtn{display:flex; align-items:center; gap:13px; text-align:left; background:var(--hanji);
  border:2.5px solid var(--line); border-radius:15px; padding:12px 14px; transition:.14s; width:100%}
.pbtn:hover{border-color:var(--gold); background:var(--gold-soft); transform:translateX(3px)}
.pbtn .n{flex:none; width:50px; height:50px; border-radius:13px; background:var(--indigo); color:#fff;
  display:grid; place-items:center; font-weight:900; font-size:17px; font-family:var(--en); line-height:1.05; text-align:center}
.pbtn.jd .n{background:var(--jade)}
.pbtn .t{min-width:0}
.pbtn .t b{display:block; font-weight:900; font-size:18px; letter-spacing:-.01em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pbtn .t span{display:block; color:var(--muted); font-weight:500; font-size:14px; font-family:var(--en)}

/* ───── STEP 1 어휘 ───── */
.vhead{display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start}
.vpanel{background:linear-gradient(160deg,#fff,var(--gold-soft)); border:3px solid var(--gold);
  border-radius:22px; min-height:290px; padding:20px 24px 18px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; position:relative}
.vpanel .ph{color:#B08E3E; font-weight:700; font-size:17px; line-height:1.7; font-family:var(--en)}
.vpanel .lnbig{position:absolute; top:12px; right:18px; font-family:var(--en); font-weight:800;
  font-size:15px; color:#fff; background:var(--vermil); padding:5px 13px; border-radius:999px; letter-spacing:.03em}
.vpanel .w{font-family:var(--en); font-weight:800; font-size:44px; color:var(--indigo);
  letter-spacing:-.02em; line-height:1.15; word-break:break-word}
.vpanel .pos{display:inline-block; background:var(--jade); color:#fff; font-family:var(--en);
  font-weight:800; font-size:14px; padding:3px 11px; border-radius:7px; margin-bottom:6px; letter-spacing:.06em}
.vpanel .m{font-weight:800; font-size:25px; margin-top:6px; letter-spacing:-.01em}
.vpanel .ctx{font-family:var(--en); font-size:19px; color:#4A4636; line-height:1.66; margin-top:15px;
  background:#fff; border-radius:13px; padding:14px 18px; border:2.5px solid var(--gold); text-align:left; width:100%}
.vpanel .ctx b{color:var(--vermil); font-weight:800; background:rgba(237,169,27,.25); border-radius:5px; padding:1px 5px}

.vsec{display:flex; align-items:center; gap:12px; margin:24px 0 13px}
.vsec b{font-family:var(--en); font-weight:800; font-size:19px; color:var(--indigo); letter-spacing:.04em}
.vsec i{flex:1; height:3px; background:repeating-linear-gradient(90deg,var(--gold) 0 16px, transparent 16px 26px)}
.vgrid{display:grid; grid-template-columns:repeat(5,1fr); gap:14px}
.vbear{width:108px; margin:20px 0 0 6px; display:block}
.flip{perspective:1200px; height:150px}
.flip .in{position:relative; width:100%; height:100%; transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.4,.2,.2,1)}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute; inset:0; backface-visibility:hidden; border-radius:18px;
  display:grid; place-items:center; text-align:center; padding:30px 12px 34px; border:3px solid}
.flip .f{background:var(--paper); border-color:var(--line); color:var(--indigo)}
.flip .b{background:var(--indigo); border-color:var(--indigo-d); color:#fff; transform:rotateY(180deg)}
.flip .f .wd{font-family:var(--en); font-weight:800; font-size:26px; line-height:1.2; word-break:break-word}
.flip .b .wd{font-weight:800; font-size:21px; line-height:1.35}
.flip .tag{position:absolute; top:8px; left:12px; font-size:9.5px; font-weight:800; opacity:.4;
  letter-spacing:.16em; font-family:var(--en)}
.flip .pb{position:absolute; top:7px; right:10px; font-family:var(--en); font-weight:800; font-size:14px;
  color:#fff; background:var(--jade); border-radius:7px; padding:2px 9px; letter-spacing:.02em}
.flip .b .pb{background:var(--gold); color:var(--indigo-d)}
.flip .ln{position:absolute; bottom:7px; left:50%; transform:translateX(-50%);
  font-family:var(--en); font-weight:800; font-size:21px; color:#fff; background:var(--vermil);
  padding:3px 15px; border-radius:999px; letter-spacing:.01em; white-space:nowrap;
  box-shadow:0 2px 0 rgba(150,40,28,.35)}
.flip .b .ln{background:var(--gold); color:var(--indigo-d)}
.flip.sel .f{border-color:var(--vermil); box-shadow:0 0 0 4px rgba(210,60,44,.22)}

/* ───── STEP 2 본문 ───── */
.secbar{display:flex; align-items:center; gap:13px; background:var(--indigo); color:#fff;
  border-radius:15px; padding:13px 20px; margin-bottom:18px}
.secbar .tt{font-family:var(--en); font-weight:800; font-size:21px; letter-spacing:.01em}
.secbar .pg{margin-left:auto; background:var(--gold); color:var(--indigo-d); font-family:var(--en);
  font-weight:800; font-size:15px; padding:5px 14px; border-radius:999px}
.sent{padding:16px 4px 8px; border-bottom:2px dashed var(--line)}
.sent:last-child{border-bottom:none}
.en{font-family:var(--en); font-weight:600; font-size:33px; line-height:2.0; letter-spacing:-.012em}
.ko{font-weight:400; font-size:15px; line-height:1.55; color:#B3AC9B; margin-top:9px; letter-spacing:-.01em}
.gw{cursor:pointer; border-radius:6px; padding:1px 3px; transition:.12s; font-weight:700}
.gw.G{color:var(--indigo2); box-shadow:inset 0 -13px 0 rgba(30,68,150,.15)}
.gw.G:hover{box-shadow:inset 0 -38px 0 rgba(30,68,150,.22)}
.gw.G.on{background:var(--indigo); color:#fff; box-shadow:none}
.gw.E{color:var(--jade); box-shadow:inset 0 -13px 0 rgba(21,164,141,.19)}
.gw.E:hover{box-shadow:inset 0 -38px 0 rgba(21,164,141,.28)}
.gw.E.on{background:var(--jade); color:#fff; box-shadow:none}
.gcards{display:flex; flex-direction:column; gap:11px; margin-top:13px}
.gcard{border-radius:16px; padding:15px 20px; animation:pop .18s ease-out; border:3px solid}
.gcard.G{background:#F4F7FD; border-color:var(--indigo2); box-shadow:0 5px 0 rgba(30,68,150,.16)}
.gcard.E{background:#EFFAF7; border-color:var(--jade2); box-shadow:0 5px 0 rgba(21,164,141,.18)}
@keyframes pop{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
.gcard .t{font-weight:900; font-size:21px; margin-bottom:5px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.gcard.G .t{color:var(--indigo)} .gcard.E .t{color:var(--jade)}
.gcard .t em{font-family:var(--en); font-style:normal; background:#fff; padding:2px 10px;
  border-radius:7px; border:2px solid currentColor; font-weight:700; font-size:19px}
.gcard .t .kd{font-family:var(--en); font-size:11px; font-weight:800; letter-spacing:.14em;
  color:#fff; padding:3px 9px; border-radius:6px}
.gcard.G .t .kd{background:var(--indigo2)} .gcard.E .t .kd{background:var(--jade2)}
.gcard .d{font-size:19px; line-height:1.66; font-weight:500; color:#33384A}

/* 리뷰 */
.revs{display:grid; grid-template-columns:repeat(3,1fr); gap:15px; margin-top:6px}
.rev{background:var(--hanji); border:3px solid var(--line); border-radius:18px; padding:16px 18px}
.rev .hd{display:flex; align-items:center; gap:9px; margin-bottom:10px}
.rev .av{width:38px; height:38px; border-radius:50%; background:var(--jade2); color:#fff;
  display:grid; place-items:center; font-family:var(--en); font-weight:800; font-size:17px}
.rev .nm{font-family:var(--en); font-weight:800; font-size:17px}
.rev .tm{font-size:12.5px; color:var(--muted); font-family:var(--en)}
.rev .bd{font-family:var(--en); font-weight:600; font-size:21px; line-height:1.62}
.rev .ko{font-size:14px; margin-top:7px}

/* ───── Grammar ───── */
.gp-hero{background:linear-gradient(135deg,var(--jade) 0%, var(--indigo2) 100%); color:#fff;
  border-radius:22px; padding:24px 30px; position:relative; overflow:hidden; border:4px solid var(--gold)}
.gp-hero .no{font-family:var(--en); font-weight:800; font-size:14px; letter-spacing:.24em; color:var(--gold2)}
.gp-hero h2{margin:5px 0 4px; font-size:38px; font-weight:900; letter-spacing:-.03em}
.gp-hero .sub{font-family:var(--en); font-size:21px; font-weight:600; color:#DFF3EE}
.gp-core{background:var(--paper); border:3px solid var(--line); border-radius:18px;
  padding:19px 24px; margin-top:18px; font-size:21px; line-height:1.7; font-weight:500}
.gp-core b{color:var(--vermil); font-weight:900}
table.gt{width:100%; border-collapse:separate; border-spacing:0; margin-top:16px;
  border:3px solid var(--line); border-radius:16px; overflow:hidden; background:#fff}
table.gt th{background:var(--indigo); color:#fff; font-family:var(--en); font-weight:800;
  font-size:16px; padding:12px 16px; text-align:left; letter-spacing:.05em}
table.gt td{padding:13px 16px; border-top:2px solid var(--line); font-size:19.5px; font-weight:600; vertical-align:middle}
table.gt td:first-child{font-family:var(--en); font-weight:800; color:var(--indigo2); font-size:21px; white-space:nowrap}
table.gt td:last-child{font-family:var(--en); color:var(--muted); font-weight:500; font-size:17px}
.exlist{display:flex; flex-direction:column; gap:13px; margin-top:16px}
.exrow{background:var(--jade-soft); border:3px solid var(--jade2); border-radius:17px; padding:16px 20px}
.exrow .e{font-family:var(--en); font-weight:600; font-size:26px; line-height:1.55}
.exrow .e b{color:var(--vermil); font-weight:800; background:#fff; padding:1px 7px; border-radius:6px}
.exrow .k{font-size:15px; color:#84937F; margin-top:7px; font-weight:400}
.exrow .note{margin-top:9px; font-family:var(--en); font-size:15px; font-weight:700; color:var(--jade);
  background:#fff; display:inline-block; padding:5px 13px; border-radius:8px; border:2px solid var(--jade2)}
.fromtext{margin-top:18px; background:var(--gold-soft); border:3px dashed var(--gold); border-radius:18px; padding:17px 22px}
.fromtext .lb{font-family:var(--en); font-weight:800; font-size:13px; letter-spacing:.16em; color:#8A6207; margin-bottom:6px}
.fromtext .e{font-family:var(--en); font-weight:600; font-size:24px; line-height:1.58}
.fromtext .k{font-size:15px; color:#A99873; margin-top:6px}
.fromtext .src{font-family:var(--en); font-size:13px; color:#A9883C; margin-top:7px; font-weight:700}
.tipbox{margin-top:16px; background:var(--vermil-soft); border-left:9px solid var(--vermil);
  border-radius:0 16px 16px 0; padding:16px 22px; font-size:20px; line-height:1.66; font-weight:500}
.tipbox b{color:var(--vermil); font-weight:900}
.tipbox .lb{font-family:var(--en); font-weight:800; font-size:13px; letter-spacing:.16em;
  color:var(--vermil); display:block; margin-bottom:5px}

/* Practice */
.prow{background:var(--paper); border:3px solid var(--line); border-radius:18px; padding:18px 22px; margin-bottom:14px}
.prow .qn{display:flex; align-items:flex-start; gap:12px}
.prow .qi{flex:none; width:38px; height:38px; border-radius:11px; background:var(--jade); color:#fff;
  display:grid; place-items:center; font-family:var(--en); font-weight:800; font-size:18px}
.prow .qt{font-family:var(--en); font-weight:600; font-size:24px; line-height:1.6; flex:1; padding-top:3px}
.prow .qt .bl{display:inline-block; min-width:180px; height:1.15em; border-bottom:3px solid var(--gold);
  vertical-align:-4px; margin:0 4px; background:rgba(240,176,45,.12); border-radius:4px 4px 0 0}
.prow .qt .fill{color:var(--jade); font-weight:800; background:rgba(15,124,110,.10);
  border-radius:6px; padding:0 7px}
.prow .qk{font-size:14.5px; color:#B3AC9B; margin:7px 0 0 50px; font-weight:400}
.slotbar{display:flex; flex-wrap:wrap; gap:9px; margin:14px 0 0 50px; min-height:52px;
  background:var(--hanji); border:2.5px dashed var(--line); border-radius:13px; padding:8px 11px; align-items:center}
.wbank{display:flex; flex-wrap:wrap; gap:9px; margin:11px 0 0 50px}
.wtok{font-family:var(--en); font-weight:700; font-size:21px; padding:9px 17px; border-radius:12px;
  background:#fff; border:3px solid var(--indigo2); color:var(--indigo); transition:.13s}
.wtok:hover{background:var(--indigo2); color:#fff}
.wtok.used{opacity:.22; pointer-events:none}
.wtok.placed{background:var(--indigo); color:#fff; border-color:var(--indigo-d); cursor:default}
.wtok.shake{animation:sh .38s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.wtok.bad{background:var(--vermil); border-color:#96271A; color:#fff}
.opts2{display:flex; gap:11px; margin:14px 0 0 50px; flex-wrap:wrap}
.opt2{font-family:var(--en); font-weight:700; font-size:22px; padding:11px 24px; border-radius:13px;
  background:#fff; border:3px solid var(--line); transition:.13s}
.opt2:hover{border-color:var(--jade2)}
.opt2.right{background:var(--jade); border-color:#0A5F52; color:#fff}
.opt2.wrong{background:var(--vermil); border-color:#96271A; color:#fff}
.pwhy{display:none; margin:13px 0 0 50px; background:var(--jade-soft); border:2.5px solid var(--jade2);
  border-radius:13px; padding:12px 17px; font-size:18px; line-height:1.62; font-weight:500}
.pwhy.on{display:block}
.pwhy .lb{font-family:var(--en); font-weight:800; font-size:12px; letter-spacing:.15em; color:var(--jade); display:block; margin-bottom:4px}
.done-badge{display:none; margin-left:auto; background:var(--jade); color:#fff; font-family:var(--en);
  font-weight:800; font-size:13px; padding:5px 13px; border-radius:999px; letter-spacing:.08em}
.prow.solved .done-badge{display:inline-block}
.prow.solved{border-color:var(--jade2); background:#F6FDFB}

/* ───── 하단바 ───── */
.dock{position:fixed; left:0; right:0; bottom:0; z-index:70; background:rgba(250,244,230,.97);
  border-top:3px solid var(--line); backdrop-filter:blur(8px); display:flex; align-items:center;
  gap:12px; padding:11px 22px; box-shadow:0 -6px 22px rgba(21,48,110,.10)}
.nav{display:flex; gap:10px}
.nb{display:flex; align-items:center; gap:8px; background:var(--indigo); color:#fff; font-weight:800;
  font-family:var(--en); letter-spacing:.05em; font-size:17px; padding:12px 22px; border-radius:13px;
  transition:.14s; box-shadow:0 3px 0 var(--indigo-d)}
.nb:hover{background:var(--indigo2)}
.nb:active{transform:translateY(2px); box-shadow:none}
.nb.ghost{background:var(--gold); color:var(--indigo-d); box-shadow:0 3px 0 #B37F06}
.nb:disabled{background:#D6CFBC; color:#fff; box-shadow:none; cursor:default}
.tools{display:flex; align-items:center; gap:9px; margin-left:auto; flex-wrap:wrap}
.tool{width:46px; height:46px; border-radius:12px; border:3px solid var(--line); background:#fff;
  display:grid; place-items:center; font-size:21px; transition:.14s}
.tool:hover{border-color:var(--gold)}
.tool.on{background:var(--indigo); border-color:var(--indigo-d); color:#fff}
.sw{width:34px; height:34px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 2.5px var(--line)}
.sw.on{box-shadow:0 0 0 4px var(--indigo)}
.tsep{width:2px; height:34px; background:var(--line); margin:0 3px}
.tlabel{font-family:var(--en); font-weight:800; font-size:14px; color:var(--muted); letter-spacing:.1em}
.pgnum{font-family:var(--en); font-weight:800; font-size:17px; color:var(--indigo);
  background:var(--gold-soft); border:2.5px solid var(--gold); padding:8px 15px; border-radius:11px}
#toast{position:fixed; left:50%; bottom:92px; transform:translateX(-50%) translateY(14px); z-index:95;
  background:var(--indigo); color:#fff; font-weight:800; font-size:16px; padding:11px 24px;
  border-radius:999px; box-shadow:0 8px 22px rgba(12,30,72,.32); opacity:0; pointer-events:none; transition:.25s}
#toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

@media (max-width:1400px){
  .vgrid{grid-template-columns:repeat(4,1fr)}
  .navgrid{grid-template-columns:1fr}
  .en{font-size:29px; line-height:1.95}
}
@media (max-width:1050px){
  .vhead{grid-template-columns:1fr} .vgrid{grid-template-columns:repeat(3,1fr)}
  .revs{grid-template-columns:1fr} .plist{grid-template-columns:1fr}
}
@media print{.dock,.topbar{display:none}}
</style>
</head>

 world under the name “Korean Wave.”", "ko": "한국 대중문화는 '한류'라는 이름으로 전 세계에서 사랑받고 있다.", "g": [["is loved", "수동태", "「be동사 + p.p.」 형태의 수동태. 주어 Korean pop culture가 '사랑을 받는' 대상이므로 수동태를 썼다.", "G"], ["under the name", "under the name of A", "'A라는 이름으로'. 뒤에 고유한 명칭이 온다.", "E"]]}, {"en": "Korean pop music has topped global music charts.", "ko": "한국 대중음악은 세계 음악 차트에서 1위를 차지해 왔다.", "g": [["has topped", "현재완료", "과거에 시작된 일이 현재까지 이어짐을 나타낸다. top은 여기서 '1위를 차지하다'라는 동사.", "G"]]}, {"en": "Korean films and TV shows attract fans from across the globe.", "ko": "한국 영화와 TV 프로그램은 전 세계의 팬들을 끌어모은다.", "g": [["from across the globe", "across the globe", "'전 세계에서'. all over the world와 같은 뜻으로, 앞 문장의 표현을 바꿔 쓴 것이다.", "E"]]}, {"en": "Now, beyond pop culture, the world is starting to pay attention to Korea’s traditional culture.", "ko": "이제 대중문화를 넘어 전 세계가 한국의 전통문화에 주목하기 시작하고 있다.", "g": [["beyond", "전치사 beyond", "'~을 넘어서'. 대중문화 → 전통문화로 화제가 확장되는 지점을 알리는 신호어다.", "E"], ["pay attention to", "pay attention to A", "'A에 주목하다'. to는 전치사이므로 뒤에 명사나 동명사가 온다.", "E"]]}, {"en": "Let’s take a look at some Korean heritage recognized abroad.", "ko": "해외에서 인정받고 있는 한국의 문화유산을 살펴보자.", "g": [["recognized abroad", "과거분사구의 명사 수식", "앞의 명사 heritage를 뒤에서 수식한다. '인정받는' 이라는 수동의 뜻이므로 과거분사를 썼다. 글 전체의 화제를 제시하는 문장이다.", "G"]]}]}, {"id": "R2", "sec": "Hanji", "label": "Paper for Restoration", "page": 60, "lines": "8–11", "bear": 6, "s": [{"en": "In Europe, paper is used for the restoration of cultural assets.", "ko": "유럽에서 종이는 문화재 복원에 사용된다.", "g": [["is used for", "be used for A", "'A에 사용되다'. 「be used to+동사원형」(~하는 데 사용되다)과 형태를 구분해야 한다.", "G"]]}, {"en": "For example, paper can be used to repair the damaged areas of paintings and other things made of paper.", "ko": "예를 들어, 종이는 그림이나 종이로 만들어진 다른 물건의 손상된 부분을 수리하는 데 사용될 수 있다.", "g": [["be used to repair", "be used to + 동사원형", "'~하는 데 사용되다'. 앞 문장의 be used for A와 짝을 이루는 표현이다.", "G"], ["made of paper", "과거분사구", "other things를 뒤에서 수식한다. made of는 재료의 성질이 그대로 남아 있을 때 쓴다.", "G"]]}, {"en": "It can also bring new life to decaying furniture and sculptures by filling in the cracks.", "ko": "또한 종이는 갈라진 틈을 메움으로써 부패하고 있는 가구와 조각품에 새 생명을 불어넣을 수 있다.", "g": [["decaying", "현재분사의 명사 수식", "'부패하고 있는'. 가구가 스스로 썩는 것이므로 능동의 현재분사를 썼다.", "G"], ["by filling in", "by + 동명사", "'~함으로써'. 수단·방법을 나타낸다. by 뒤에는 반드시 동명사가 온다.", "G"]]}]}, {"id": "R3", "sec": "Hanji", "label": "Washi and the Louvre", "page": 60, "lines": "12–15", "bear": 5, "s": [{"en": "For such purposes, the Japanese paper called washi has been widely used.", "ko": "그러한 목적으로 와시라고 불리는 일본 종이가 널리 사용되어 왔다.", "g": [["called washi", "과거분사구", "the Japanese paper를 뒤에서 수식한다. '와시라고 불리는'이라는 수동의 뜻.", "G"], ["has been widely used", "현재완료 수동태", "「have been + p.p.」. 과거부터 지금까지 계속 사용되어 왔음을 나타낸다.", "G"]]}, {"en": "The Louvre Museum in France was no exception.", "ko": "프랑스의 루브르 박물관도 예외는 아니었다.", "g": [["was no exception", "be no exception", "'예외가 아니다'. 앞에서 말한 일반적 경향이 이 대상에도 그대로 적용된다는 뜻이다.", "E"]]}, {"en": "However, a Korean who was working at the Louvre in 2014 wanted to let the world know the value of hanji, traditional handmade Korean paper.", "ko": "하지만 2014년 루브르에서 일하고 있던 한 한국인이 한국의 전통 수제 종이인 한지의 가치를 세계에 알리고 싶어 했다.", "g": [["However", "역접 신호어", "와시가 쓰이던 흐름을 뒤집는 지점. 한지 이야기가 시작되는 전환점이다.", "E"], ["who was working", "주격 관계대명사", "선행사 a Korean을 수식한다. 이 절 때문에 주어와 동사(wanted)의 거리가 멀어졌다.", "G"], ["let the world know", "사역동사 let + 목적어 + 동사원형", "'세계가 알게 하다'. 사역동사 let·make·have는 목적격보어로 원형부정사를 취한다.", "G"], ["traditional handmade Korean paper", "동격", "앞의 hanji를 콤마로 이어 다시 설명한다.", "G"]]}]}, {"id": "R4", "sec": "Hanji", "label": "The Experiment", "page": 61, "lines": "1–6", "bear": 5, "s": [{"en": "He convinced the head of the museum’s restoration team to read his study on the comparison of traditional papers from Korea and Japan.", "ko": "그는 박물관 복원팀장을 설득해 한국과 일본의 전통 종이를 비교한 자신의 연구를 읽게 했다.", "g": [["convinced the head of the museum’s restoration team to read", "convince + 목적어 + to부정사", "'~에게 …하도록 설득하다'. to부정사를 목적격보어로 취하는 동사다.", "G"]]}, {"en": "After reading his study, the Louvre became interested in hanji and carried out an experiment to see whether it would be suitable for use in restoration.", "ko": "그의 연구를 읽은 후, 루브르는 한지에 관심을 갖게 되었고 그것이 복원에 사용하기 적합한지 알아보기 위해 실험을 실시했다.", "g": [["After reading", "전치사 + 동명사", "After는 전치사이므로 뒤에 동명사가 왔다. 분사구문으로 보아도 뜻은 같다.", "G"], ["whether", "접속사 whether", "'~인지 아닌지'. see의 목적어가 되는 명사절을 이끈다. if로 바꿔 쓸 수 있다.", "G"], ["carried out", "carry out A", "'A를 수행하다, 실시하다'. conduct와 같은 뜻이다.", "E"]]}, {"en": "They wet both washi and hanji to compare their durability.", "ko": "그들은 내구성을 비교하기 위해 와시와 한지를 둘 다 적셨다.", "g": [["both washi and hanji", "both A and B", "'A와 B 둘 다'. 상관접속사이므로 A와 B의 형태가 같아야 한다.", "G"]]}, {"en": "Ultimately, hanji was found to be more durable than washi.", "ko": "결국 한지가 와시보다 더 내구성이 좋은 것으로 밝혀졌다.", "g": [["was found to be", "be found to-v", "'~한 것으로 밝혀지다'. 실험 결과를 제시하는 문장이다.", "G"], ["more durable than", "비교급", "'~보다 더 내구성이 좋은'. 이 글의 핵심 대조(한지 vs 와시)가 드러나는 부분이다.", "G"]]}]}, {"id": "R5", "sec": "Hanji", "label": "Why Hanji Is Stronger", "page": 61, "lines": "6–12", "bear": 1, "s": [{"en": "Unlike washi, which has its fibers lined up in one direction, hanji is made with both horizontal and vertical fibers.", "ko": "섬유가 한 방향으로 정렬되어 있는 와시와 달리, 한지는 수평·수직 섬유를 모두 사용하여 만들어진다.", "g": [["Unlike", "전치사 unlike", "'~와 달리'. 대조를 이끄는 신호어로, 뒤에 명사(구)가 온다.", "E"], ["which has", "계속적 용법의 관계대명사", "콤마 뒤의 which가 앞의 washi를 보충 설명한다. that으로 바꿔 쓸 수 없다.", "G"], ["lined up", "have + 목적어 + p.p.", "섬유가 '정렬되어 있는' 상태이므로 목적격보어로 과거분사를 썼다.", "G"]]}, {"en": "This means that the fibers in hanji are more closely woven, making the paper stronger.", "ko": "이는 한지의 섬유가 더 촘촘하게 짜여 있어 종이를 더 튼튼하게 만든다는 뜻이다.", "g": [["making the paper stronger", "분사구문", "and it makes the paper stronger를 분사구문으로 줄인 형태. 앞 내용의 결과를 덧붙인다.", "G"]]}, {"en": "This also allows hanji to maintain its original size and shape better when there is a change in its moisture content.", "ko": "또한 이 덕분에 한지는 수분 함량에 변화가 있을 때에도 원래의 크기와 모양을 더 잘 유지할 수 있다.", "g": [["allows hanji to maintain", "allow + 목적어 + to부정사", "'~가 …할 수 있게 하다'. 무생물 주어이므로 '이 덕분에 ~할 수 있다'로 해석하면 자연스럽다.", "G"]]}, {"en": "Because of its durability, hanji was proven to be excellent material for restoration.", "ko": "그 내구성 덕분에 한지는 복원에 훌륭한 재료임이 입증되었다.", "g": [["Because of", "because of + 명사", "'~ 때문에'. 뒤에 「주어+동사」가 오는 접속사 because와 구별해야 한다.", "G"]]}]}, {"id": "R6", "sec": "Hanji", "label": "Hanji at the Louvre", "page": 61, "lines": "12–17", "bear": 2, "s": [{"en": "Thus, in 2017, the Louvre used hanji for the first time to restore a relic from its collection.", "ko": "그리하여 2017년에 루브르는 소장 유물을 복원하기 위해 처음으로 한지를 사용했다.", "g": [["for the first time", "for the first time", "'처음으로'. at first(처음에는)와 뜻이 다르니 주의한다.", "E"]]}, {"en": "Since then, hanji has been used more and more to restore various cultural assets of the museum.", "ko": "그 이후로 한지는 박물관의 다양한 문화재를 복원하는 데 점점 더 많이 사용되고 있다.", "g": [["Since then", "Since then + 현재완료", "'그 이후로'. 과거의 한 시점부터 현재까지 이어지므로 현재완료와 함께 쓴다.", "G"], ["more and more", "비교급 and 비교급", "'점점 더 많이'. 변화의 흐름을 강조한다.", "E"]]}, {"en": "Who knows?", "ko": "누가 알겠는가?", "g": [["Who knows?", "수사의문문", "'누가 알겠는가?' = 아무도 모른다, 어쩌면 그럴 수도 있다. 뒤의 상상으로 이어지는 장치다.", "E"]]}, {"en": "Maybe someday the Mona Lisa, one of the museum’s most famous paintings, will be restored with hanji.", "ko": "어쩌면 언젠가 박물관에서 가장 유명한 그림 중 하나인 모나리자가 한지로 복원될지도 모른다.", "g": [["one of the museum’s most famous paintings", "동격 + one of the 최상급", "앞의 the Mona Lisa를 설명하는 동격어구. 「one of the + 최상급 + 복수명사」는 '가장 ~한 것들 중 하나'.", "G"], ["will be restored", "미래 수동태", "「will be + p.p.」. 모나리자가 '복원되는' 대상이므로 수동태를 썼다.", "G"]]}]}, {"id": "R7", "sec": "Homi", "label": "Reviews from Abroad", "page": 62, "lines": "1–3", "bear": 1, "s": [{"en": "Search for “Korean homi” on any online platform, and you can find reviews like these:", "ko": "어떤 온라인 플랫폼에서든 '한국 호미'를 검색해 보면 이런 후기들을 찾을 수 있다.", "g": [["and you can find", "명령문 + and", "'~해라, 그러면 …할 것이다'. 「명령문 + or」(그렇지 않으면)와 구별해야 한다.", "G"]]}], "reviews": [["Lina", "20 minutes ago", "This is the best gardening tool I have ever had.", "이건 내가 써 본 원예 도구 중 최고예요.", [["I have ever had", "현재완료 + ever", "최상급 뒤에서 '지금까지 ~해 본 것 중에'라는 뜻으로 쓰인다. tool 뒤에 목적격 관계대명사 that이 생략되었다.", "G"]]], ["Oliver", "a month ago", "If you enjoy gardening, this will for sure give you extra pleasure.", "원예를 즐긴다면 이건 분명 특별한 즐거움을 줄 거예요.", [["enjoy gardening", "enjoy + 동명사", "enjoy는 목적어로 to부정사가 아닌 동명사를 취한다.", "G"], ["for sure", "for sure", "'확실히, 분명히'. certainly와 같은 뜻의 구어 표현이다.", "E"]]], ["Benjamin", "3 days ago", "Whatever you may expect, this is beyond your imagination.", "무엇을 기대하든, 이건 상상 그 이상이에요.", [["Whatever you may expect", "복합관계대명사 (Point 1)", "'무엇을 ~하더라도'. whatever = no matter what. 양보의 부사절을 이끈다. Grammar Point 1의 문장이다.", "G"], ["beyond your imagination", "beyond A", "'A를 넘어서는'. 앞 R1의 beyond pop culture와 같은 쓰임이다.", "E"]]]]}, {"id": "R8", "sec": "Homi", "label": "A Hot New Tool", "page": 62, "lines": "4–7", "bear": 2, "s": [{"en": "Also, there are many videos praising the homi and showing how to use it.", "ko": "또한 호미를 칭찬하고 사용법을 보여주는 많은 영상이 있다.", "g": [["praising the homi and showing", "현재분사의 병렬", "두 개의 현재분사가 and로 연결되어 앞의 many videos를 함께 수식한다.", "G"], ["how to use it", "의문사 + to부정사", "'그것을 사용하는 방법'. showing의 목적어 역할을 한다.", "G"]]}, {"en": "The Korean homi is becoming the hot new tool gardeners around the world must have.", "ko": "한국 호미는 전 세계 정원사들이 반드시 가져야 할 새로운 인기 도구가 되고 있다.", "g": [["tool gardeners around the world must have", "목적격 관계대명사 생략", "the hot new tool (that) gardeners ~ must have. 명사 뒤에 「주어+동사」가 바로 오면 관계대명사가 생략된 신호다.", "G"]]}, {"en": "What is a homi and why is it so popular?", "ko": "호미란 무엇이며 왜 그렇게 인기가 있는 걸까?", "g": [["What is a homi and why is it so popular?", "질문으로 화제 제시", "글쓴이가 던지는 두 개의 질문이 이후 문단의 뼈대가 된다. 답을 찾으며 읽어야 한다.", "E"]]}]}, {"id": "R9", "sec": "Homi", "label": "How It Spread", "page": 62, "lines": "8–13", "bear": 5, "s": [{"en": "The Korean homi is a traditional farming tool that has gotten a lot of attention, not in Korea but in countries like the United States and Australia.", "ko": "한국 호미는 한국이 아니라 미국이나 호주 같은 나라에서 많은 관심을 받아 온 전통 농기구이다.", "g": [["that has gotten", "주격 관계대명사", "선행사 a traditional farming tool을 수식한다. 선행사가 단수이므로 has를 썼다.", "G"], ["not in Korea but in countries", "not A but B (Point 2)", "'A가 아니라 B'. A와 B 자리에 같은 형태(전치사구)가 왔다. Grammar Point 2의 문장이다.", "G"]]}, {"en": "In 2019, a video of how to use a homi spread quickly and widely on the Internet.", "ko": "2019년에 호미 사용법을 담은 영상이 인터넷에서 빠르고 널리 퍼졌다.", "g": [["spread", "불규칙 동사 spread", "spread-spread-spread로 형태가 변하지 않는다. 여기서는 과거형이다.", "G"]]}, {"en": "Suddenly, the homi had become one of the top selling gardening tools on the largest online shopping site in the world.", "ko": "갑자기 호미는 세계 최대 온라인 쇼핑 사이트에서 가장 많이 팔리는 원예 도구 중 하나가 되어 있었다.", "g": [["had become", "과거완료", "영상이 퍼진 과거 시점보다 더 앞서거나 그 결과로 이미 이루어진 상태를 나타낸다.", "G"]]}]}, {"id": "R10", "sec": "Homi", "label": "One Tool, Many Jobs", "page": 63, "lines": "1–6", "bear": 7, "s": [{"en": "The homi became so popular because it can be used for a wide range of gardening tasks.", "ko": "호미는 다양한 원예 작업에 사용될 수 있기 때문에 그렇게 인기를 얻었다.", "g": [["a wide range of", "a wide range of A", "'다양한 A'. 인기의 첫 번째 이유를 제시하는 핵심 표현이다.", "E"]]}, {"en": "In fact, people in Europe and the U.S. use separate gardening tools to weed, dig, and firm the ground.", "ko": "실제로 유럽과 미국 사람들은 잡초를 뽑고, 파고, 땅을 다지는 데 각각 다른 원예 도구를 사용한다.", "g": [["to weed, dig, and firm", "to부정사의 병렬", "목적을 나타내는 to부정사 뒤에 동사원형 세 개가 나란히 연결되었다.", "G"]]}, {"en": "However, a homi has an ideal shape that makes all those activities possible with one tool.", "ko": "하지만 호미는 그 모든 작업을 도구 하나로 가능하게 하는 이상적인 모양을 갖고 있다.", "g": [["makes all those activities possible", "make + 목적어 + 형용사", "'~을 …하게 만들다'. 목적격보어 자리에 형용사 possible이 왔다.", "G"]]}, {"en": "Its thinnest blade is used for weeding, and the sharp point is used to dig the ground.", "ko": "가장 얇은 날은 잡초를 뽑는 데 쓰이고, 뾰족한 끝은 땅을 파는 데 쓰인다.", "g": [["is used for weeding", "be used for vs. be used to-v", "앞은 「for + 동명사」, 뒤는 「to + 동사원형」. 두 형태가 한 문장에 나란히 쓰였다.", "G"]]}, {"en": "The flat side is used to firm the ground.", "ko": "평평한 면은 땅을 다지는 데 쓰인다.", "g": [["The flat side", "열거의 마무리", "thinnest blade → sharp point → flat side로 이어지는 세 부분의 마지막이다.", "E"]]}]}, {"id": "R11", "sec": "Homi", "label": "Made by Hand", "page": 63, "lines": "7–13", "bear": 8, "s": [{"en": "Next, a homi has a comfortable design.", "ko": "다음으로, 호미는 편안한 디자인을 갖고 있다.", "g": [["Next", "열거의 신호어", "인기의 두 번째 이유를 꺼내는 지점이다.", "E"]]}, {"en": "The Korean homi is usually handmade by blacksmiths.", "ko": "한국 호미는 보통 대장장이가 손으로 만든다.", "g": [["handmade by blacksmiths", "수동태 + by", "행위자를 by로 밝혔다. '대장장이에 의해 수제로 만들어진다'는 뜻이다.", "G"]]}, {"en": "From decades of experience, they have found the best angles between the handle and the blade so that users can tend gardens without pain in their arms and hands.", "ko": "수십 년의 경험을 통해 그들은 사용자가 팔과 손에 통증 없이 정원을 가꿀 수 있도록 손잡이와 날 사이의 최적의 각도를 찾아냈다.", "g": [["so that users can tend gardens", "so that + 주어 + can", "'~가 …할 수 있도록'. 목적을 나타내는 부사절이다.", "G"], ["without pain", "without + 명사", "'~ 없이'. 편안한 디자인이 주는 결과를 구체적으로 보여준다.", "E"]]}, {"en": "During the manufacturing process, a homi is hammered several times by hand, which makes it stronger and more elaborate.", "ko": "제작 과정에서 호미는 손으로 여러 번 망치질되는데, 이것이 호미를 더 튼튼하고 정교하게 만든다.", "g": [["which makes", "계속적 용법의 which", "콤마 뒤의 which가 앞 절 전체를 받는다. '그리고 그것이 ~하다'로 해석한다.", "G"]]}, {"en": "This is what differentiates the handmade Korean homi from gardening tools made by machine.", "ko": "이것이 수제 한국 호미를 기계로 만든 원예 도구와 구별해 주는 점이다.", "g": [["what differentiates", "관계대명사 what", "'~하는 것'. 선행사를 포함하므로 앞에 명사가 없다. 보어 역할을 한다.", "G"], ["the handmade Korean homi from gardening tools", "differentiate A from B", "'A를 B와 구별하다'. 두 대상을 대조하는 이 글의 방식이 압축된 표현이다.", "E"]]}]}, {"id": "R12", "sec": "Closing", "label": "Spreading Worldwide", "page": 63, "lines": "13–17", "bear": 1, "s": [{"en": "As you see above, the reputation of Korean heritage is spreading throughout the world.", "ko": "위에서 본 것처럼, 한국 문화유산의 명성은 전 세계로 퍼지고 있다.", "g": [["As you see abov function shrink(f, cb){
  const r=new FileReader();
  r.onload=()=>{ const im=new Image();
    im.onload=()=>{ const M=1400; let w=im.width,h=im.height;
      if(w>M||h>M){const k=M/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k);}
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const c=cv.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,w,h); c.drawImage(im,0,0,w,h);
      try{ cb(cv.toDataURL('image/jpeg',.82)); }catch(e){ cb(r.result); } };
    im.onerror=()=>cb(r.result); im.src=r.result; };
  r.readAsDataURL(f);
}

function flatVocab(){ const a=[]; VOCAB.forEach(s => s.words.forEach(w => a.push(w))); return a; }
function hl(sent, word){
  const stop={'a':1,'an':1,'the':1,'to':1,'of':1,'in':1,'on':1,'with':1,'be':1};
  const toks=(word.replace(/\([^)]*\)/g,'').match(/[A-Za-z][A-Za-z'\-]*/g)||[]).filter(t=>!stop[t.toLowerCase()]);
  const base=(toks[0]||word).toLowerCase();
  const phrase=word.replace(/\([^)]*\)/g,'').trim();
  const alt=[];
  if(phrase.split(/\s+/).length>1) alt.push(phrase);
  alt.push(base, base+'s', base+'es', base+'ed', base+'d', base+'ing', base+'ies', base+'ied',
           base+base.slice(-1)+'ed', base+base.slice(-1)+'ing');
  if(base.endsWith('e')) alt.push(base.slice(0,-1)+'ing', base.slice(0,-1)+'ed');
  if(base.endsWith('y')) alt.push(base.slice(0,-1)+'ies', base.slice(0,-1)+'ied');
  if(base==='weave') alt.push('woven','wove');
  const rest=alt.slice(1).sort((a,b)=>b.length-a.length);
  const ord=(phrase.split(/\s+/).length>1)?[alt[0]].concat(rest):rest;
  let out=esc(sent);
  for(const a of ord){
    const re=new RegExp('\\b('+a.replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&')+')\\b','i');
    if(re.test(out)){ out=out.replace(re,'<b>$1</b>'); break; }
  }
  return out;
}

function markup(en, gs, sid){
  let t=esc(en); const hits=[];
  (gs||[]).forEach((g,gi)=>{ const ph=esc(g[0]); const at=t.indexOf(ph);
    if(at>=0) hits.push({at:at, len:ph.length, gi:gi, kd:g[3]||'G'}); });
  hits.sort((a,b)=>a.at-b.at);
  let out='', last=0;
  hits.forEach(h=>{ if(h.at<last) return;
    out += t.slice(last,h.at)
        + '<span class="gw '+h.kd+'" data-s="'+sid+'" data-g="'+h.gi+'">'+t.slice(h.at,h.at+h.len)+'</span>';
    last=h.at+h.len; });
  return out + t.slice(last);
}

  });
  if(r.reviews){
    h+='<div class="revs">';
    r.reviews.forEach((rv,ri)=>{
      h+='<div class="rev"><div class="hd"><div class="av">'+esc(rv[0][0])+'</div>'
       + '<div><div class="nm">'+esc(rv[0])+'</div><div class="tm">'+esc(rv[1])+'</div></div></div>'
       + '<div class="bd">'+markup(rv[2], rv[4], 'r'+ri)+'</div>'
       + '<div class="ko">'+esc(rv[3])+'</div><div class="gcards" id="gcr'+ri+'"></div></div>';
    });
    h+='</div>';
  }
  return h+'</div>';
}
function bindWords(){
  document.querySelectorAll('.gw').forEach(w=>{
    w.onclick=()=>{
      const sid=w.dataset.s, gi=+w.dataset.g;
      const box=document.getElementById(String(sid).startsWith('r')?('gcr'+sid.slice(1)):('gc'+sid));
      if(!box) return;
      const has=box.querySelector('[data-g="'+gi+'"]');
      if(has){ has.remove(); w.classList.remove('on'); return; }
      const r=READ[SC[cur].i];
      const g = String(sid).startsWith('r') ? r.reviews[+sid.slice(1)][4][gi] : r.s[+sid].g[gi];
      const kd=g[3]||'G';
      const d=document.createElement('div'); d.className='gcard '+kd; d.dataset.g=gi;
      d.innerHTML='<div class="t"><em>'+esc(g[0])+'</em>'+esc(g[1])
        +'<span class="kd">'+(kd==='G'?'GRAMMAR':'EXPRESSION')+'</span></div>'
        +'<div class="d">'+esc(g[2])+'</div>';
      box.appendChild(d); w.classList.add('on');
    };
  });
}

/* ───── Grammar Point ───── */
function renderGram(i){
  const g=GRAM[i];
  let h='<div class="gp-hero">'+bear(i===0?1:7,'right:30px; top:12px; width:92px; opacity:.97')
   + '<div class="no">GRAMMAR POINT '+g.no+'</div><h2>'+esc(g.title)+'</h2>'
   + '<div class="sub">'+esc(g.sub)+'</div></div>'
   + '<div class="card" style="margin-top:18px">'
   + '<div class="gp-core">'+g.core+'</div><table class="gt"><tr><th>FORM</th><th>뜻</th><th>= 바꿔 쓰기</th></tr>';
  g.table.forEach(t=>{ h+='<tr><td>'+esc(t[0])+'</td><td>'+esc(t[1])+'</td><td>'+esc(t[2])+'</td></tr>'; });
  h+='</table><div class="exlist">';
  g.ex.forEach(e=>{
    let s=esc(e[0]);
    String(e[2]).split(' / ').forEach(k=>{ const kk=esc(k);
      s=s.split(kk).join('\u0001'+kk+'\u0002'); });
    s=s.split('\u0001').join('<b>').split('\u0002').join('</b>');
    h+='<div class="exrow"><div class="e">'+s+'</div><div class="k">'+esc(e[1])+'</div>'
     + '<div class="note">'+esc(e[3])+'</div></div>';
  });
  h+='</div><div class="fromtext"><div class="lb">FROM THE TEXT · 본문에서 찾기</div>'
   + '<div class="e">'+esc(g.fromtext[0])+'</div><div class="k">'+esc(g.fromtext[1])+'</div>'
   + '<div class="src">'+esc(g.fromtext[2])+'</div></div>'
   + '<div class="tipbox"><span class="lb">CHECK POINT</span>'+g.tip+'</div></div>';

  // Practice
  h+='<div class="card" style="margin-top:18px">'
   + '<span class="chip j">PRACTICE</span><h2 class="sec">'
   + (g.ptype==='order' ? '주어진 말을 알맞게 배열하기' : '어법에 맞는 표현 고르기') + '</h2>'
   + '<p class="sec-note">'
   + (g.ptype==='order'
      ? '단어를 <b>순서대로</b> 누르세요. 틀린 단어를 누르면 제자리로 돌아갑니다.'
      : '둘 중 알맞은 것을 고르세요. 정답을 맞히면 이유가 나타납니다.') + '</p>'
   + '<div class="rowbtns"><button class="mini j" onclick="resetPr()">RESET</button>'
   + '<button class="mini" onclick="showPr()">ANSWER</button></div>';

  g.practice.forEach((q,qi)=>{
    const sk='p'+g.no+'_'+qi, done=!!solved[sk];
    h+='<div class="prow'+(done?' solved':'')+'" id="pr'+qi+'"><div class="qn">'
     + '<span class="qi">'+(qi+1)+'</span><span class="qt" id="qt'+qi+'">'+qBlank(q.q)+'</span>'
     + '<span class="done-badge">SOLVED</span></div>'
     + '<div class="qk">'+esc(q.ko)+'</div>';
    if(g.ptype==='order'){
      h+='<div class="slotbar" id="sl'+qi+'"></div><div class="wbank" id="wb'+qi+'">';
      q.words.forEach((w,wi)=>{ h+='<button class="wtok" data-w="'+wi+'" onclick="pick('+qi+','+wi+')">'+esc(w)+'</button>'; });
      h+='</div>';
    } else {
      h+='<div class="opts2" id="op'+qi+'">';
      q.opts.forEach((o,oi)=>{ h+='<button class="opt2" onclick="choose('+qi+','+oi+','+q.ans+')">'+esc(o)+'</button>'; });
      h+='</div>';
    }
    h+='<div class="pwhy'+(done?' on':'')+'" id="pw'+qi+'"><span class="lb">WHY</span>'+esc(q.why)+'</div></div>';
  });
  return h+'</div>';
}
function curG(){ return GRAM[SC[cur].i]; }
function pick(qi, wi){
  const g=curG(), q=g.practice[qi];
  const sl=document.getElementById('sl'+qi), wb=document.getElementById('wb'+qi);
  const btn=wb.querySelector('[data-w="'+wi+'"]');
  const pos=sl.children.length;
  if(pos>=q.ans.length) return;
  if(q.words[wi].toLowerCase() !== q.ans[pos].toLowerCase().replace(/[^a-z']/g,'')
     && q.words[wi].toLowerCase() !== q.ans[pos].toLowerCase()){
    btn.classList.add('shake','bad');
    setTimeout(()=>btn.classList.remove('shake','bad'), 420);
    return;
  }
  const t=document.createElement('span'); t.className='wtok placed'; t.textContent=q.ans[pos];
  sl.appendChild(t); btn.classList.add('used');
  if(sl.children.length===q.ans.length){
    document.getElementById('qt'+qi).innerHTML = qFill(q.q, q.ans.join(' '));
    document.getElementById('pw'+qi).classList.add('on');
    document.getElementById('pr'+qi).classList.add('solved');
    solved['p'+g.no+'_'+qi]=1; save(1);
  }
}
function qBlank(s){ return esc(s).replace(/\(\s+\)|___+/, '<span class="bl"></span>'); }
function qFill(s, w){ return esc(s).replace(/\(\s+\)|___+/, '<b class="fill">'+esc(w)+'</b>'); }
function choose(qi, oi, ans){
  const g=curG(), wrap=document.getElementById('op'+qi);
  [...wrap.children].forEach(b=>b.classList.remove('right','wrong'));
  wrap.children[oi].classList.add(oi===ans?'right':'wrong');
  if(oi===ans){
    wrap.children[ans].classList.add('right');
    document.getElementById('pw'+qi).classList.add('on');
    document.getElementById('pr'+qi).classList.add('solved');
    document.getElementById('qt'+qi).innerHTML = qFill(g.practice[qi].q, g.practice[qi].opts[ans]);
    solved['p'+g.no+'_'+qi]=1; save(1);
  } else {
    wrap.children[oi].classList.add('shake');
    setTimeout(()=>wrap.children[oi].classList.remove('shake','wrong'), 600);
  }
}
function showPr(){
  const g=curG();
  g.practice.forEach((q,qi)=>{
    if(g.ptype==='order'){
      const sl=document.getElementById('sl'+qi), wb=document.getElementById('wb'+qi);
      sl.innerHTML=''; [...wb.children].forEach(b=>b.classList.add('used'));
      q.ans.forEach(a=>{ const t=document.createElement('span'); t.className='wtok placed'; t.textContent=a; sl.appendChild(t); });
      document.getElementById('qt'+qi).innerHTML=qFill(q.q, q.ans.join(' '));
    } else {
      const wrap=document.getElementById('op'+qi);
      [...wrap.children].forEach((b,bi)=>{ b.classList.remove('right','wrong'); if(bi===q.ans) b.classList.add('right'); });
      document.getElementById('qt'+qi).innerHTML=qFill(q.q, q.opts[q.ans]);
    }
    document.getElementById('pw'+qi).classList.add('on');
    document.getElementById('pr'+qi).classList.add('solved');
  });
}
function resetPr(){
  const g=curG();
  g.practice.forEach((q,qi)=>{ delete solved['p'+g.no+'_'+qi]; });
  save(1); paint();
}

/* ───── 화면 전환 ───── */
function paint(){
  saveInk();
  const view=document.getElementById('view'), steps=document.getElementById('tbSteps');
  if(cur<0){
    view.innerHTML=renderHome(); steps.innerHTML='';
    document.getElementById('tbBadge').textContent='Lesson 3';
    document.getElementById('tbTitle').textContent='Go Beyond Korea';
    document.getElementById('tbSub').textContent='공통영어2 · Read On & Grammar Points';
    document.getElementById('pgnum').textContent='HOME';
    document.getElementById('prevBtn').disabled=true;
    document.getElementById('nextBtn').disabled=false;
  } else {
    const s=SC[cur];
    if(s.k==='vocab') view.innerHTML=renderVocab();
    else if(s.k==='read') view.innerHTML=renderRead(s.i);
    else view.innerHTML=renderGram(s.i);
    steps.innerHTML=SC.map((x,i)=>'<button class="tb-step'+(x.k==='gram'?' gp':'')+(i===cur?' on':'')
      +'" onclick="go('+i+')">'+x.label+'</button>').join('');
    if(s.k==='gram'){
      const g=GRAM[s.i];
      document.getElementById('tbBadge').textContent='Point '+g.no;
      document.getElementById('tbTitle').textContent=g.title;
      document.getElementById('tbSub').textContent=g.sub;
    } else if(s.k==='read'){
      const r=READ[s.i];
      document.getElementById('tbBadge').textContent='p.'+r.page;
      document.getElementById('tbTitle').textContent=r.label;
      document.getElementById('tbSub').textContent=r.sec+' · \u2113.'+r.lines;
    } else {
      document.getElementById('tbBadge').textContent='Words';
      document.getElementById('tbTitle').textContent='Vocabulary';
      document.getElementById('tbSub').textContent='Read On · p.60~63';
    }
    document.getElementById('pgnum').textContent=(cur+1)+' / '+SC.length;
    document.getElementById('prevBtn').disabled=false;
    document.getElementById('nextBtn').disabled=(cur>=SC.length-1);
  }
  bindWords(); window.scrollTo(0,0);
  setTimeout(()=>{ fitInk(); loadInk(); }, 30);
}
function go(i){ cur=i; paint(); }
function goHome(){ cur=-1; paint(); }
function step(d){ const n=cur+d; if(n<-1||n>=SC.length) return; cur=n; paint(); }

/* ───── 필기 ───── */
const ink=document.getElementById('ink'), cx=ink.getContext('2d');
let drawing=false, color='#D23C2C', eraser=false, penOn=false;
function fitInk(){
  const st=document.getElementById('stage');
  const w=st.clientWidth, h=Math.max(st.clientHeight, window.innerHeight-100);
  if(ink.width===w&&ink.height===h) return;
  const keep=ink.width?ink.toDataURL():null;
  ink.width=w; ink.height=h; ink.style.width=w+'px'; ink.style.height=h+'px';
  if(keep){const im=new Image(); im.onload=()=>cx.drawImage(im,0,0); im.src=keep;}
}
function saveInk(){ if(!ink.width) return;
  const b=document.createElement('canvas'); b.width=ink.width; b.height=ink.height;
  const d=ink.toDataURL(); if(d!==b.toDataURL()) store[key()]=d; else delete store[key()]; }
function loadInk(){ cx.clearRect(0,0,ink.width,ink.height);
  const d=store[key()]; if(d){const im=new Image(); im.onload=()=>cx.drawImage(im,0,0); im.src=d;} }
function pos(e){ const r=ink.getBoundingClientRect(), t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left, y:t.clientY-r.top}; }
function start(e){ if(!penOn) return; e.preventDefault(); drawing=true;
  const p=pos(e); cx.beginPath(); cx.moveTo(p.x,p.y); cx.lineCap='round'; cx.lineJoin='round'; }
function move(e){ if(!drawing) return; e.preventDefault(); const p=pos(e);
  if(eraser){cx.globalCompositeOperation='destination-out'; cx.lineWidth=36;}
  else {cx.globalCompositeOperation='source-over'; cx.lineWidth=5; cx.strokeStyle=color;}
  cx.lineTo(p.x,p.y); cx.stroke(); }
function end(){ drawing=false; }
['mousedown','touchstart'].forEach(e=>ink.addEventListener(e,start,{passive:false}));
['mousemove','touchmove'].forEach(e=>ink.addEventListener(e,move,{passive:false}));
['mouseup','mouseleave','touchend','touchcancel'].forEach(e=>ink.addEventListener(e,end));
function togglePen(){ penOn=!penOn; if(penOn) eraser=false;
  document.body.classList.toggle('pen',penOn);
  document.getElementById('penBtn').classList.toggle('on',penOn&&!eraser);
  document.getElementById('eraBtn').classList.remove('on'); }
function toggleEraser(){ eraser=!eraser; penOn=eraser?true:penOn;
  document.body.classList.toggle('pen',penOn);
  document.getElementById('eraBtn').classList.toggle('on',eraser);
  document.getElementById('penBtn').classList.toggle('on',penOn&&!eraser); }
function setColor(b){ document.querySelectorAll('.sw').forEach(s=>s.classList.remove('on'));
  b.classList.add('on'); color=b.dataset.c; eraser=false;
  if(!penOn) togglePen();
  document.getElementById('eraBtn').classList.remove('on');
  document.getElementById('penBtn').classList.add('on'); }
function clearInk(){ cx.clearRect(0,0,ink.width,ink.height); delete store[key()]; }

window.addEventListener('resize', fitInk);
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight') step(1);
  if(e.key==='ArrowLeft') step(-1);
  if(e.key==='Escape') goHome();
});
new MutationObserver(()=>setTimeout(fitInk,40)).observe(document.getElementById('view'),{childList:true,subtree:true});
load(); paint();
</script>
